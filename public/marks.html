<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marks Entry — Vidya Setu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>
  const content = renderShell({ activeKey: "marks", eyebrow: "Assessment", title: "Marks Entry" });
  content.innerHTML = `
    <div class="card card-pad" style="margin-bottom:18px;">
      <div class="section-head"><div><h2 style="font-size:15px;">1. Choose Class</h2></div></div>
      <div class="class-select-grid" id="class-chips"></div>
    </div>
    <div class="two-col">
      <div class="card card-pad">
        <div class="section-head"><div><h2 style="font-size:15px;">2. Select Student</h2><div class="sub" id="student-count-sub">Pick a class to see students</div></div></div>
        <input type="text" id="student-search" placeholder="Search in class..." style="width:100%;padding:9px 12px;border:1.5px solid var(--line-strong);border-radius:8px;margin-bottom:10px;font-size:13.5px;" />
        <div class="student-picker-list" id="student-list"><p style="color:var(--slate);font-size:13px;">No class selected yet.</p></div>
      </div>
      <div class="card card-pad" style="grid-column:span 1;" id="marks-panel">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <h3>Select a student</h3>
          <p>Marks entry form will appear here once you pick a student from the list.</p>
        </div>
      </div>
    </div>
  `;
</script>

<script>
  let SELECTED_CLASS = null;
  let SELECTED_STUDENT = null;
  let CLASS_STUDENTS = [];
  let EXAM_TYPES = [];

  async function init() {
    const meta = await apiFetch("/meta/classes");
    const examMeta = await apiFetch("/meta/exam-types");
    EXAM_TYPES = examMeta.examTypes;

    const chipWrap = document.getElementById("class-chips");
    chipWrap.innerHTML = meta.classes
      .map((c) => `<div class="class-chip" data-class="${c}" onclick="selectClass('${c}')">Class ${c}</div>`)
      .join("");

    document.getElementById("student-search").addEventListener(
      "input",
      debounce((e) => renderStudentList(e.target.value), 250)
    );

    const preselect = new URLSearchParams(window.location.search).get("studentId");
    if (preselect) {
      const data = await apiFetch("/students/" + preselect + "?" + withSession().toString());
      if (data.student) {
        await selectClass(data.student.class, data.student.id);
      }
    }
  }

  async function selectClass(cls, preselectStudentId = null) {
    SELECTED_CLASS = cls;
    document.querySelectorAll(".class-chip").forEach((el) => el.classList.toggle("active", el.dataset.class === cls));
    document.getElementById("student-list").innerHTML = `<div class="center-loader" style="padding:20px;"><div class="loader"></div></div>`;

    const params = withSession();
    params.set("class", cls);
    const data = await apiFetch("/students?" + params.toString());
    CLASS_STUDENTS = data.students;
    document.getElementById("student-count-sub").textContent = `${data.students.length} student(s) in Class ${cls}`;
    renderStudentList("");

    if (preselectStudentId) {
      const s = CLASS_STUDENTS.find((x) => String(x.id) === String(preselectStudentId));
      if (s) selectStudent(s.id);
    } else {
      document.getElementById("marks-panel").innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/></svg>
          <h3>Select a student</h3><p>Choose a student from the list to enter marks.</p>
        </div>`;
    }
  }

  function renderStudentList(query) {
    const q = (query || "").toLowerCase();
    const filtered = CLASS_STUDENTS.filter(
      (s) => s.name.toLowerCase().includes(q) || String(s.rollNo).includes(q) || String(s.regNo).includes(q)
    );
    const list = document.getElementById("student-list");
    if (!filtered.length) {
      list.innerHTML = `<p style="color:var(--slate);font-size:13px;">No students found.</p>`;
      return;
    }
    list.innerHTML = filtered
      .map(
        (s) => `
        <div class="student-picker-row ${SELECTED_STUDENT && SELECTED_STUDENT.id === s.id ? "active" : ""}" onclick="selectStudent('${s.id}')">
          <div class="avatar" style="width:30px;height:30px;border-radius:50%;background:var(--navy-100);color:var(--navy-700);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;${s.photoUrl ? `background-image:url('${s.photoUrl}');background-size:cover;` : ""}">${s.photoUrl ? "" : initials(s.name)}</div>
          <div style="flex:1;">
            <div style="font-size:13.5px;font-weight:700;color:var(--navy-900);">${s.name}</div>
            <div style="font-size:11.5px;color:var(--slate);">Roll ${s.rollNo} · ${s.regNo}</div>
          </div>
        </div>`
      )
      .join("");
  }

  function selectStudent(id) {
    SELECTED_STUDENT = CLASS_STUDENTS.find((x) => String(x.id) === String(id));
    renderStudentList(document.getElementById("student-search").value);
    renderMarksForm();
  }

  function renderMarksForm() {
    const s = SELECTED_STUDENT;
    const panel = document.getElementById("marks-panel");
    const subjects = s.subjects || [];

    const headerCells = EXAM_TYPES.map((e) => `<th>${e.label}<span class="maxlbl">/ ${e.max}</span></th>`).join("");

    const rows = subjects
      .map((subj) => {
        const marks = s.marks[subj] || {};
        const inputs = EXAM_TYPES.map(
          (e) => `<td><input type="number" min="0" max="${e.max}" step="0.5" data-subject="${subj}" data-exam="${e.key}" value="${marks[e.key] !== null && marks[e.key] !== undefined ? marks[e.key] : ""}" /></td>`
        ).join("");
        return `<tr><td>${subj}</td>${inputs}</tr>`;
      })
      .join("");

    panel.innerHTML = `
      <div class="section-head">
        <div>
          <h2 style="font-size:15px;">${s.name}</h2>
          <div class="sub">${s.regNo} · Class ${s.class}-${s.section}${s.stream ? " · " + s.stream : ""}</div>
        </div>
      </div>
      <div class="table-wrap" style="margin-bottom:16px;">
        <table class="marks-table">
          <thead><tr><th>Subject</th>${headerCells}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="alert alert-error" id="marks-error"></div>
      <button class="btn btn-primary" id="save-marks-btn" onclick="saveMarks()">Save Marks</button>
    `;
  }

  async function saveMarks() {
    const btn = document.getElementById("save-marks-btn");
    const errEl = document.getElementById("marks-error");
    errEl.classList.remove("show");
    btn.disabled = true;
    btn.textContent = "Saving...";

    const marksPayload = {};
    document.querySelectorAll("#marks-panel input[data-subject]").forEach((input) => {
      const subj = input.dataset.subject;
      const exam = input.dataset.exam;
      marksPayload[subj] = marksPayload[subj] || {};
      marksPayload[subj][exam] = input.value === "" ? null : Number(input.value);
    });

    try {
      const res = await apiFetch("/students/" + SELECTED_STUDENT.id + "/marks?" + withSession().toString(), {
        method: "PUT",
        body: JSON.stringify({ marks: marksPayload })
      });
      const idx = CLASS_STUDENTS.findIndex((x) => x.id === SELECTED_STUDENT.id);
      CLASS_STUDENTS[idx] = res.student;
      SELECTED_STUDENT = res.student;
      toast("Marks saved successfully.", "success");
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.add("show");
    } finally {
      btn.disabled = false;
      btn.textContent = "Save Marks";
    }
  }

  init();
</script>
</body>
</html>
